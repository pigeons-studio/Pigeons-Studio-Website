button:focus-visible { outline: 1px solid var(--cyan); outline-offset: 3px; }
#monde { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

/* le cadre */
#cadre { position: fixed; pointer-events: none; z-index: 3;
  top: calc(var(--marge) + env(safe-area-inset-top, 0px)); bottom: calc(var(--marge) + env(safe-area-inset-bottom, 0px));
  left: max(var(--marge), env(safe-area-inset-left, 0px)); right: max(var(--marge), env(safe-area-inset-right, 0px));
  border: 1px solid var(--trait); }
#cadre .c { position: absolute; display: flex; gap: 14px; align-items: baseline; padding: 10px 14px; letter-spacing: .08em; pointer-events: auto; }
#cadre .hg { top: 0; left: 0; letter-spacing: .32em; }
#cadre .hd { top: 0; right: 0; }
#cadre .bg { bottom: 0; left: 0; color: var(--gris); }
#cadre .bd { bottom: 0; right: 0; }
#etat b { color: var(--encre); font-weight: 400; }
#panier { color: var(--or); }
#retour { color: var(--gris); }
#retour:hover, #panier:hover { color: var(--encre); }
#retour[hidden] { display: none; }
.coin { position: absolute; width: 10px; height: 10px; border: 0 solid var(--gris); }
.coin.a { left: -1px; top: -1px; border-width: 1px 0 0 1px; } .coin.b { right: -1px; top: -1px; border-width: 1px 1px 0 0; }
.coin.c { left: -1px; bottom: -1px; border-width: 0 0 1px 1px; } .coin.d { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; }

/* le tracker : un seul, sur ce qu'on survole */
#trk { position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .15s; --c: var(--or); }
#trk.on { opacity: 1; }
#trk i { position: absolute; width: 10px; height: 10px; border: 0 solid var(--c); }
#trk i:nth-child(1) { left: 0; top: 0; border-width: 1px 0 0 1px; } #trk i:nth-child(2) { right: 0; top: 0; border-width: 1px 1px 0 0; }
#trk i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 1px 1px; } #trk i:nth-child(4) { right: 0; bottom: 0; border-width: 0 1px 1px 0; }
#trk span { position: absolute; left: 100%; top: 0; margin-left: 10px; white-space: nowrap; line-height: 16px; color: var(--c); letter-spacing: .06em; }
#trk span em { display: block; font-style: italic; color: var(--gris); letter-spacing: 0; }

/* la page 2D */
#page { position: fixed; z-index: 2; overflow-y: auto; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; transform: translateY(10px);
  top: calc(var(--marge) + env(safe-area-inset-top, 0px) + 44px); bottom: calc(var(--marge) + env(safe-area-inset-bottom, 0px) + 44px);
  left: max(var(--marge), env(safe-area-inset-left, 0px)); right: max(var(--marge), env(safe-area-inset-right, 0px)); }
#page.on { opacity: 1; pointer-events: auto; transform: none; }
#page .dedans { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 24px; display: flex; flex-direction: column; gap: 28px; }
.familles { display: flex; gap: 8px; }
.familles button { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--trait); background: rgba(0,0,0,.6); }
.familles button[aria-current="true"] { border-color: var(--or); }
.familles button:hover { border-color: var(--gris); }
.familles svg { width: 22px; height: 22px; display: block; }
.titre { display: flex; gap: 18px; align-items: center; }
.titre svg { width: 56px; height: 56px; flex: none; }
.titre h1 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; }
.titre p { margin: 2px 0 0; color: var(--gris); font-style: italic; }
.chapo { margin: 0; max-width: 62ch; line-height: 20px; }
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1px; background: var(--trait); border: 1px solid var(--trait); }
.prod { background: rgba(0,0,0,.88); padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.prod .ref { color: var(--gris); font-size: 10px; letter-spacing: .14em; }
.prod h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .04em; }
.prod p { margin: 0; color: var(--gris); line-height: 18px; flex: 1; }
.prod .pied { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; }
.prod .prix { color: var(--or); font-variant-numeric: tabular-nums; }
.btn { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 10px; border: 1px solid var(--or); color: var(--or); }
.btn.plein { background: var(--or); color: var(--nuit); }
.btn:hover { background: var(--or); color: var(--nuit); }
.btn.doux { border-color: var(--trait); color: var(--gris); }
.btn.doux:hover { background: var(--encre); color: var(--nuit); border-color: var(--encre); }
.bio { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; line-height: 20px; }
.bio h2 { margin: 0 0 6px; font-size: 11px; font-weight: 400; letter-spacing: .2em; color: var(--gris); text-transform: uppercase; }
.bio p { margin: 0; max-width: 62ch; }
.bio h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; letter-spacing: .04em; }
.duo { margin: 0; font-size: 15px; letter-spacing: .06em; }
.legende { margin: -20px 0 0; color: var(--gris); font-style: italic; }


.lead { display: flex; flex-direction: column; gap: 6px; }
.lead .sur { margin: 0; color: var(--gris); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }
.lead .duo { font-size: 16px; } .lead .legende { margin: 0; }
.texte p, .vide { margin: 0; max-width: 62ch; line-height: 20px; }
.vide { color: var(--gris); }
.etiquette { margin: 0 0 10px; font-size: 10px; font-weight: 400; letter-spacing: .2em; color: var(--gris); text-transform: uppercase; }
.liste dl { margin: 0; display: grid; grid-template-columns: minmax(0, 15em) minmax(0, 1fr); gap: 10px 24px; line-height: 18px; }
.liste dt { color: var(--encre); } .liste dd { margin: 0; color: var(--gris); max-width: 60ch; }
@media (max-width: 560px) { .liste dl { grid-template-columns: 1fr; gap: 2px; } .liste dd { margin-bottom: 10px; } }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tags span { font-size: 10px; color: var(--gris); border: 1px solid var(--trait); padding: 1px 6px; }
.films { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
.film { margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.film video { width: 100%; aspect-ratio: 4 / 5; max-width: 100%; background: #0b0b0a; border: 1px solid var(--trait); display: block; }
.film h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .04em; }
.film p { margin: 0; color: var(--gris); line-height: 17px; }
.film .duree { font-size: 10px; color: var(--gris); letter-spacing: .1em; }
#tiroir p { margin: 0; line-height: 18px; } #tiroir .sujet { color: var(--cyan); }
#tiroir .mail { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--or); user-select: all; }
#page .dedans { background: rgba(0,0,0,.72); }
.grille { background: none !important; border: 0 !important; gap: 1px !important; }
.prod { box-shadow: 0 0 0 1px var(--trait); }
.prod h2 { overflow-wrap: anywhere; }
.rayon { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding-top: 18px; border-top: 1px dashed var(--trait); }
.rayon svg { width: 24px; height: 24px; flex: none; }
.rayon h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
.rayon span { color: var(--gris); font-style: italic; }
#tiroir form { display: flex; flex-direction: column; gap: 10px; }
#tiroir label { display: flex; flex-direction: column; gap: 4px; color: var(--gris); font-size: 11px; letter-spacing: .06em; }
#tiroir input { font: inherit; color: var(--encre); background: #0b0b0a; border: 1px solid var(--trait); padding: 7px 8px; }
#tiroir input:focus-visible { outline: 1px solid var(--cyan); outline-offset: 0; }
#tiroir .ligne { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#tiroir .lien { color: var(--cyan); text-decoration: underline; text-underline-offset: 3px; }
#cadre .hd { gap: 18px; }
#connexion { color: var(--gris); } #connexion:hover { color: var(--encre); }
#tiroir { position: fixed; z-index: 5; right: max(var(--marge), env(safe-area-inset-right, 0px)); top: calc(var(--marge) + env(safe-area-inset-top, 0px) + 40px);
  width: min(300px, calc(100vw - 2 * var(--marge))); background: #000; border: 1px solid var(--trait); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
#tiroir[hidden] { display: none; }
#tiroir ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
#tiroir li { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
#tiroir li span:last-child, #tiroir .total { color: var(--or); }
#tiroir .note { color: var(--gris); font-size: 10px; }
@media (max-width: 560px) { #cadre .bg .aide { display: none; } }
</style>
</head>

function aretes (rows, s) { // contour du glyphe dans le plan xy, case = s/8
  const on = (c, r) => r >= 0 && r < 8 && c >= 0 && c < 8 && rows[r][c] === '#'
  const v = s / 8; const pts = []
  const X = (c) => -s / 2 + c * v; const Y = (r) => s / 2 - r * v
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    if (!on(c, r)) continue
    if (!on(c, r - 1)) pts.push(X(c), Y(r), 0, X(c + 1), Y(r), 0)
    if (!on(c, r + 1)) pts.push(X(c), Y(r + 1), 0, X(c + 1), Y(r + 1), 0)
    if (!on(c - 1, r)) pts.push(X(c), Y(r), 0, X(c), Y(r + 1), 0)
    if (!on(c + 1, r)) pts.push(X(c + 1), Y(r), 0, X(c + 1), Y(r + 1), 0)
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)); return g
}

const etages = FAMILLES.map((f, e) => {
  const grp = new THREE.Group(); scene.add(grp)
  const y0 = e * GAP
  const plan = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshBasicMaterial({ color: f.teinte, transparent: true, opacity: 0.04, depthWrite: false, side: THREE.DoubleSide }))
  plan.rotation.x = -Math.PI / 2
  const pts = []; const t = 0.1
  for (let x = -W / 2 + 1; x < W / 2; x += 2) for (let z = -D / 2 + 1; z < D / 2; z += 2) pts.push(x - t, 0, z, x + t, 0, z, x, 0, z - t, x, 0, z + t)
  const gc = new THREE.BufferGeometry(); gc.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3))
  const croix = new THREE.LineSegments(gc, new THREE.LineBasicMaterial({ color: 0x5a5953, transparent: true, opacity: 0.6 }))
  const bord = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(W, D)), new THREE.LineBasicMaterial({ color: f.teinte, transparent: true, opacity: 0.35 }))
  bord.rotation.x = -Math.PI / 2
  const zone = new THREE.Mesh(new THREE.BoxGeometry(W, 0.3, D), new THREE.MeshBasicMaterial({ visible: false }))
  grp.add(plan, croix, bord, zone)
  // le glyphe-menu : debout au bord droit, en arêtes ; plein quand on le survole
  const gly = new THREE.Group()
  const rows = SIGNES[f.signe].rows
  const trait = new THREE.LineSegments(aretes(rows, G), new THREE.LineBasicMaterial({ color: f.teinte, transparent: true }))
  const v = G / 8; const vox = []
  rows.forEach((row, r) => [...row].forEach((c, q) => { if (c === '#') vox.push([-G / 2 + (q + 0.5) * v, G / 2 - (r + 0.5) * v]) }))
  const plein = new THREE.InstancedMesh(new THREE.BoxGeometry(v * 0.96, v * 0.96, v * 2), new THREE.MeshStandardMaterial({ color: f.teinte, transparent: true, emissive: f.teinte, emissiveIntensity: 0.25 }), vox.length)
  vox.forEach(([x, y], i) => { plein.setMatrixAt(i, new THREE.Matrix4().makeTranslation(x, y, 0)) })
  plein.scale.z = 0.001
  const cible = new THREE.Mesh(new THREE.PlaneGeometry(G, G), new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide }))
  gly.add(trait, plein, cible)
  gly.position.set(W / 2 + 1.6, G / 2 + 0.15, 0)
  grp.add(gly)
  const pied = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(W / 2, 0, 0), new THREE.Vector3(W / 2 + 1.6, 0, 0)]), new THREE.LineDashedMaterial({ color: f.teinte, dashSize: 0.1, gapSize: 0.1, transparent: true, opacity: 0.5 }))
  pied.computeLineDistances(); grp.add(pied)
  zone.userData.e = e; cible.userData.e = e
  return { f, grp, y0, plan, croix, bord, gly, trait, plein, cible, zone, pied, chaud: 0 }
})
const cibles = etages.flatMap((x) => [x.cible, x.zone])

  const distTop = demi / Math.tan(THREE.MathUtils.degToRad(fov / 2))
  const distOrb = Math.max(44, 12 / (Math.tan(THREE.MathUtils.degToRad(17)) * a))
  const dist = lerp(distOrb * lerp(1, 0.72, z), distTop, k)
  const th = lerp(theta, Math.round(theta / (Math.PI * 2)) * Math.PI * 2, ease(Math.min(1, k * 1.25)))
  const ph = lerp(0.5 + flotte, 1.5695, k)
  dir.set(Math.sin(th) * Math.cos(ph), Math.sin(ph), Math.cos(th) * Math.cos(ph))
  const yf = etages[etat.etage].y0
  const y3d = lerp((N - 1) * GAP / 2 + flotte * 4, etageFoc() * GAP + 0.6, z)
  cib.set(lerp(1.4, 0, k), lerp(y3d, yf, k), 0)
  camera.fov = fov; camera.updateProjectionMatrix()
  camera.position.copy(cib).addScaledVector(dir, dist)
  camera.lookAt(cib)
  scene.fog.near = dist - 10; scene.fog.far = dist + 30
}
function poserEtages (dt) {
  const k = etat.k
  etages.forEach((x, e) => {
    const sel = e === etat.etage
    const y = lerp(x.y0, etages[etat.etage].y0, sel ? 0 : k)
    x.grp.position.y = y
    const loin = Math.min(1, Math.abs(e - etageFoc())) * Math.min(1, foc) * (1 - k)
    const vis = (sel ? 1 : 1 - k) * (1 - 0.75 * loin)
    x.plan.material.opacity = 0.04 * vis * (1 - k)
    x.croix.material.opacity = 0.6 * vis * (1 - 0.8 * k)
    const mq = (1 - k) * (1 - 0.8 * loin) * (survol >= 0 && survol !== e && etat.mode === '3d' ? 0.45 : 1)
    x.patch.m.material.opacity = mq
    x.patch.pts.material.opacity = mq
    x.bord.material.opacity = 0.35 * vis * (1 - k)
    x.chaud += ((etageVise() === e && etat.mode === '3d' ? 1 : 0) - x.chaud) * (1 - Math.pow(0.0005, dt))
    const g = 1 - k
    x.trait.material.opacity = g * (0.85 - 0.5 * x.chaud) * (1 - 0.7 * loin)
    x.pied.material.opacity = 0.5 * g
    x.plein.material.opacity = g
    x.plein.scale.z = Math.max(0.001, x.chaud)
    x.plein.visible = x.chaud > 0.01
    x.gly.quaternion.copy(camera.quaternion) // toujours face à soi
    x.gly.scale.setScalar(1 + x.chaud * 0.12)
  })
}

// ================================================================ survol, tracker
const ray = new THREE.Raycaster(); const souris = new THREE.Vector2(9, 9)
let survol = -1; let surGlyphe = false
canvas.addEventListener('pointermove', (e) => souris.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1))
canvas.addEventListener('pointerleave', () => souris.set(9, 9))
canvas.addEventListener('wheel', (e) => {
  if (etat.mode !== '3d') return
  e.preventDefault()
  focCible = THREE.MathUtils.clamp(focCible + e.deltaY / (e.deltaMode ? 3 : 240), 0, N)
  focRepos = 0
}, { passive: false })
canvas.addEventListener('click', (e) => { souris.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); chercher(); if (etat.mode === '3d' && survol >= 0) descendre(survol) })
function chercher () {
  if (etat.mode !== '3d' || souris.x > 2) { survol = -1; return }
  ray.setFromCamera(souris, camera)
  // quand on a avancé sur un étage, seule sa dalle (et les glyphes) réagit
  const ici = foc > 0.6 ? Math.round(etageFoc()) : -1
  const h = ray.intersectObjects(cibles, false).find((x) => ici < 0 || x.object.userData.e === ici || x.object === etages[x.object.userData.e].cible)
  survol = h ? h.object.userData.e : -1
  surGlyphe = !!h && h.object === etages[survol].cible
}
const trk = document.getElementById('trk'); const trkTxt = trk.querySelector('span')
let trkCle = ''
const P = new THREE.Vector3()
function suivre () {
  let cle = ''; let box = null
  const sv = etageVise()
  if (sv >= 0 && etat.mode === '3d') {
    const x = etages[sv]; cle = '3d' + sv
    x.gly.getWorldPosition(P)
    const r = G / 2 * x.gly.scale.x + 0.1
    let x0 = Infinity; let y0 = Infinity; let x1 = -Infinity; let y1 = -Infinity
    for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      const q = new THREE.Vector3(dx * r, dy * r, 0).applyQuaternion(camera.quaternion).add(P).project(camera)
      const sx = (q.x + 1) / 2 * innerWidth; const sy = (1 - q.y) / 2 * innerHeight
      x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy)
    }
    box = [x0, y0, x1, y1]
    if (trkCle !== cle) {
      const f = x.f
      trkTxt.replaceChildren(document.createTextNode(SIGNES[f.signe].mot + ' → ' + f.nom.toUpperCase()))
      const em = document.createElement('em'); em.textContent = 'étage ' + sv + ' · cliquer pour entrer'; trkTxt.append(em)
      trk.style.setProperty('--c', f.css)
    }
  } else if (survolHtml) { cle = 'h' + survolHtml.i; box = survolHtml.box
    if (trkCle !== cle) {
      const f = FAMILLES[survolHtml.i]
      trkTxt.replaceChildren(document.createTextNode(SIGNES[f.signe].mot + ' → ' + f.nom.toUpperCase()))
      const em = document.createElement('em'); em.textContent = survolHtml.i === etat.etage ? 'tu es ici' : 'aller à l\'étage ' + survolHtml.i; trkTxt.append(em)
      trk.style.setProperty('--c', f.css)
    }
  }
  trkCle = cle
  trk.classList.toggle('on', !!box)
  if (box) {
    const m = 6
    trk.style.transform = 'translate(' + (box[0] - m) + 'px,' + (box[1] - m) + 'px)'
    trk.style.width = (box[2] - box[0] + 2 * m) + 'px'; trk.style.height = (box[3] - box[1] + 2 * m) + 'px'
    const droite = box[2] + 220 > innerWidth
    trkTxt.style.left = droite ? 'auto' : '100%'; trkTxt.style.right = droite ? '100%' : 'auto'
    trkTxt.style.marginLeft = droite ? '0' : '10px'; trkTxt.style.marginRight = droite ? '10px' : '0'; trkTxt.style.textAlign = droite ? 'right' : 'left'
  }
}

// ================================================================ 3D ⇄ 2D
const page = document.getElementById('page'); const contenu = document.getElementById('contenu')
const etatTxt = document.getElementById('etat'); const retour = document.getElementById('retour')
function anim (vers, fin) { etat.de = etat.k; etat.vers = vers; etat.t = 0; etat.fin = fin; etat.duree = reduit ? 0.01 : 1.3 }
function descendre (e) {
  survol = -1
  etat.etage = e; etat.mode = 'vers2d'
  dire('3D → 2D', FAMILLES[e])
  document.querySelector('#cadre .aide').hidden = true
  anim(1, () => { etat.mode = '2d'; remplir(e); page.classList.add('on'); retour.hidden = false; dire('2D', FAMILLES[e]); page.scrollTop = 0 })
}
// d'une page à l'autre, directement en 2D : la page glisse, la dalle change de teinte
let enChange = false
function changer (n) {
  if (enChange || n === etat.etage) return
  enChange = true; survolHtml = null
  page.classList.remove('on')
  setTimeout(() => {
    etat.etage = n; focCible = N - n; foc = focCible
    remplir(n); dire('2D', FAMILLES[n]); page.scrollTop = 0
    page.classList.add('on'); enChange = false
  }, reduit ? 0 : 260)
}
function remonter (puis = null) {
  focCible = N - etat.etage; foc = focCible
  page.classList.remove('on'); retour.hidden = true; survolHtml = null
  etat.mode = 'vers3d'
  dire('2D → 3D', null)
  anim(0, () => {
    etat.mode = '3d'; dire('3D', null); document.querySelector('#cadre .aide').hidden = false
    if (puis !== null) setTimeout(() => descendre(puis), reduit ? 0 : 350)
  })
}
function dire (m, f) {
  etatTxt.replaceChildren()
  const b = document.createElement('b'); b.textContent = m
  etatTxt.append(b, document.createTextNode(f ? ' · étage ' + FAMILLES.indexOf(f) + ' · ' + f.nom : ' · ' + FAMILLES.length + ' étages'))
}
retour.addEventListener('click', () => remonter())
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!tiroir.hidden) { tiroir.hidden = true; return } if (etat.mode === '2d') remonter() }
  if (etat.mode === '2d' && (e.key === 'PageUp' || e.key === 'PageDown')) { const n = etat.etage + (e.key === 'PageUp' ? 1 : -1); if (n >= 0 && n < FAMILLES.length) changer(n); e.preventDefault() }
  if (etat.mode === '3d' && e.key === 'Enter' && etageVise() >= 0) descendre(etageVise())
  if (etat.mode === '3d' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { focCible = THREE.MathUtils.clamp(Math.round(focCible) + (e.key === 'ArrowDown' ? 1 : -1), 0, N); focRepos = 0; e.preventDefault() }
})

// ---------------------------------------------------------------- contenu des pages
function svgGlyphe (signe, couleur) {
  const ns = 'http://www.w3.org/2000/svg'
  const s = document.createElementNS(ns, 'svg'); s.setAttribute('viewBox', '0 0 8 8'); s.setAttribute('shape-rendering', 'crispEdges'); s.setAttribute('aria-hidden', 'true')
  SIGNES[signe].rows.forEach((row, r) => [...row].forEach((c, q) => { if (c !== '#') return
    const re = document.createElementNS(ns, 'rect'); re.setAttribute('x', q); re.setAttribute('y', r); re.setAttribute('width', 1); re.setAttribute('height', 1); re.setAttribute('fill', couleur); s.appendChild(re) }))
  return s
}
function el (tag, cls, txt) { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n }
let survolHtml = null
const prix = (n) => n.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 })
function remplir (e) {
  const f = FAMILLES[e]
  contenu.replaceChildren()
  const nav = el('nav', 'familles'); nav.setAttribute('aria-label', 'rubriques')
  FAMILLES.forEach((g, i) => {
    const b = el('button'); b.type = 'button'; b.setAttribute('aria-label', g.nom); b.setAttribute('aria-current', String(i === e))
    b.append(svgGlyphe(g.signe, i === e ? g.css : '#8a8780'))
    b.addEventListener('pointerenter', () => { const r = b.getBoundingClientRect(); survolHtml = { i, box: [r.left, r.top, r.right, r.bottom] } })
    b.addEventListener('pointerleave', () => { survolHtml = null })
    b.addEventListener('click', () => { if (i !== e) changer(i) })
    nav.append(b)
  })
  const titre = el('div', 'titre')
  const tt = el('div'); tt.append(el('h1', null, f.nom), el('p', null, SIGNES[f.signe].mot + (f.pourquoi !== SIGNES[f.signe].mot ? ' · ' + f.pourquoi : '')))
  titre.append(svgGlyphe(f.signe, f.css), tt)
  contenu.append(nav, titre)
  for (const b of f.blocs) {
    if (b.t === 'lead') { const d = el('div', 'lead'); d.append(el('p', 'sur', b.sur), el('p', 'duo', b.duo), el('p', 'legende', b.legende)); contenu.append(d) }
    if (b.t === 'texte') { const d = el('section', 'texte'); if (b.titre) d.append(el('h2', 'etiquette', b.titre)); d.append(el('p', null, b.p)); contenu.append(d) }
    if (b.t === 'vide') contenu.append(el('p', 'vide', b.p))
    if (b.t === 'deux') { const d = el('div', 'bio'); b.items.forEach(([n, r, p]) => { const x = el('section'); x.append(el('h3', null, n), el('h2', null, r), el('p', null, p)); d.append(x) }); contenu.append(d) }
    if (b.t === 'liste') {
      const d = el('section', 'liste'); d.append(el('h2', 'etiquette', b.titre))
      const dl = el('dl'); b.items.forEach(([k, v]) => dl.append(el('dt', null, k), el('dd', null, v))); d.append(dl); contenu.append(d)
    }
    if (b.t === 'rayon') {
      const h = el('div', 'rayon'); const sg = svgGlyphe(b.signe, f.css); h.append(sg, el('h2', null, b.titre), el('span', null, SIGNES[b.signe].mot)); contenu.append(h)
      if (b.vide) contenu.append(el('p', 'vide', b.vide))
    }
    if ((b.t === 'cartes' || b.t === 'rayon') && b.items) {
      const gr = el('div', 'grille')
      b.items.forEach((it, i) => {
        const c = el('article', 'prod')
        c.append(el('div', 'ref', (b.code || f.code) + '.' + String(i + 1).padStart(2, '0')), el('h2', null, it.nom), el('p', null, it.sens))
        if (it.tags) { const t = el('div', 'tags'); it.tags.forEach((x) => t.append(el('span', null, x))); c.append(t) }
        if (it.prix) {
          const pied = el('div', 'pied'); pied.append(el('span', 'prix', it.prix))
          const a = el('button', 'btn', it.prix === 'Sur devis' ? 'demander un devis' : 'être prévenu'); a.type = 'button'
          a.addEventListener('click', () => ouvrirContact(it.nom)); pied.append(a); c.append(pied)
        }
        gr.append(c)
      })
      contenu.append(gr)
    }
    if (b.t === 'films') {
      const gr = el('div', 'films')
      b.items.forEach((it) => {
        const c = el('figure', 'film')
        const v = document.createElement('video')
        v.src = it.src; v.poster = it.src.replace('.mp4', '.jpg'); v.controls = true; v.preload = 'none'; v.playsInline = true; v.muted = true
        v.setAttribute('aria-label', it.nom)
        const cap = el('figcaption'); cap.append(el('h2', null, it.nom), el('p', null, it.sens), el('span', 'duree', it.duree))
        c.append(v, cap); gr.append(c)
      })
      contenu.append(gr)
    }
    if (b.t === 'devis') { const d = el('div', 'pied'); const a = el('button', 'btn', 'demander un devis'); a.type = 'button'; a.addEventListener('click', () => ouvrirContact('')); d.append(a); contenu.append(d) }
  }
}

// ---------------------------------------------------------------- contact (la boutique n'a pas encore de paiement : on écrit au studio)
const bContact = document.getElementById('panier'); const tiroir = document.getElementById('tiroir')
const EMAIL = 'contact@punkhazard.org'
function ouvrirContact (sujet) {
  tiroirDe = 'contact'
  tiroir.replaceChildren(el('div', 'etiquette', 'CONTACT'))
  tiroir.append(el('p', null, 'Marques, institutions, robotique et IA : parlons de votre projet.'))
  if (sujet) tiroir.append(el('p', 'sujet', 'à propos de : ' + sujet))
  const m = el('div', 'mail'); m.append(el('span', null, EMAIL))
  const c = el('button', 'btn doux', 'copier'); c.type = 'button'
  c.addEventListener('click', async () => { try { await navigator.clipboard.writeText(EMAIL); c.textContent = 'copié' } catch (_) { const r = document.createRange(); r.selectNodeContents(m.firstChild); getSelection().removeAllRanges(); getSelection().addRange(r) } })
  m.append(c); tiroir.append(m, el('p', 'note', 'Réponse généralement sous 24-48h.'))
  const f = el('button', 'btn doux', 'fermer'); f.type = 'button'; f.addEventListener('click', () => { tiroir.hidden = true })
  tiroir.append(f); tiroir.hidden = false
}
bContact.addEventListener('click', () => { if (!tiroir.hidden && tiroirDe === 'contact') tiroir.hidden = true; else ouvrirContact('') })
// ---------------------------------------------------------------- connexion (maquette ; dans le dépôt, NextAuth : email + mot de passe, ou Google)
const bConnexion = document.getElementById('connexion')
let tiroirDe = ''
function ouvrirConnexion (inscription = false) {
  tiroirDe = 'connexion'
  tiroir.replaceChildren(el('div', 'etiquette', inscription ? 'CRÉER UN COMPTE' : 'CONNEXION'))
  const form = el('form'); form.noValidate = true
  const champ = (id, lab, type, auto) => { const l = el('label', null, lab); const i = document.createElement('input'); i.id = id; i.type = type; i.autocomplete = auto; l.append(i); return l }
  if (inscription) form.append(champ('compte-nom', 'Nom', 'text', 'name'))
  form.append(champ('compte-email', 'Email', 'email', 'email'), champ('compte-mdp', 'Mot de passe', 'password', inscription ? 'new-password' : 'current-password'))
  const msg = el('p', 'note', '')
  const go = el('button', 'btn plein', inscription ? 'S’inscrire' : 'Se connecter'); go.type = 'submit'
  form.append(go, msg)
  form.addEventListener('submit', (e) => {
    e.preventDefault()
    const em = form.querySelector('#compte-email').value.trim(); const mdp = form.querySelector('#compte-mdp').value
    if (!em || !mdp) { msg.textContent = 'Tous les champs sont requis.'; return }
    if (inscription && mdp.length < 8) { msg.textContent = 'Le mot de passe doit contenir au moins 8 caractères.'; return }
    msg.textContent = 'Maquette : la connexion n’est pas encore branchée. Dans le site, elle passera par NextAuth.'
    form.querySelector('#compte-mdp').value = ''
  })
  const g = el('button', 'btn doux', 'Se connecter avec Google'); g.type = 'button'
  g.addEventListener('click', () => { msg.textContent = 'Maquette : la connexion Google sera branchée dans le site.' })
  const bas = el('div', 'ligne')
  const bascule = el('button', 'lien', inscription ? 'Déjà un compte ? Se connecter' : 'Pas encore de compte ? S’inscrire'); bascule.type = 'button'
  bascule.addEventListener('click', () => ouvrirConnexion(!inscription))
  const f = el('button', 'btn doux', 'fermer'); f.type = 'button'; f.addEventListener('click', () => { tiroir.hidden = true })
  bas.append(bascule)
  tiroir.append(form, g, bas, f); tiroir.hidden = false
  form.querySelector('input').focus()
}
bConnexion.addEventListener('click', () => { if (!tiroir.hidden && tiroirDe === 'connexion') tiroir.hidden = true; else ouvrirConnexion() })

let audio = null
function jouer (notes) {
  audio = audio || new AudioContext(); const t0 = audio.currentTime + 0.05
  notes.forEach((n, i) => {
    const o = audio.createOscillator(); const v = audio.createGain()
    o.type = 'triangle'; o.frequency.value = 220 * Math.pow(2, n / 12)
    const t = t0 + i * 0.2
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(0.09, t + 0.01); v.gain.exponentialRampToValueAtTime(0.0001, t + 0.35)
    o.connect(v).connect(audio.destination); o.start(t); o.stop(t + 0.4)
  })
}

// ================================================================ boucle
function taille () { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight }
addEventListener('resize', taille); taille()
const horloge = new THREE.Clock(); let temps = 0
const vue = new THREE.Vector3()
function boucle () {
  const dt = Math.min(horloge.getDelta(), 0.05); temps += dt
  if (etat.t < 1) { etat.t = Math.min(1, etat.t + dt / etat.duree); etat.k = lerp(etat.de, etat.vers, ease(etat.t)); if (etat.t >= 1 && etat.fin) { const f = etat.fin; etat.fin = null; f() } }
  // flottaison : la vue respire autour de son angle, sans jamais tourner
  if (!reduit) { theta = 0.62 + Math.sin(temps * 0.13) * 0.07 + Math.sin(temps * 0.051) * 0.04; flotte = Math.sin(temps * 0.09) * 0.035 }
  if (etat.mode === '3d') { focRepos += dt; if (focRepos > 0.35) focCible += (Math.round(focCible) - focCible) * 0.15 }
  foc += (focCible - foc) * (1 - Math.pow(0.004, dt))
  placerCamera()
  chercher()
  poserEtages(dt)
  animerPatchs(dt)
  // le pigeon : perché sur le glyphe survolé, sinon sur celui du rez-de-chaussée ; il disparaît en 2D
  const p = etageVise() >= 0 ? etageVise() : 0
  etages[p].gly.getWorldPosition(vue)
  pigeon.position.lerp(vue.add(new THREE.Vector3(0, G / 2 * etages[p].gly.scale.x + 0.02, 0)), 0.12)
  pigeon.position.y += reduit ? 0 : Math.sin(temps * 2.2) * 0.004
  pigeon.quaternion.copy(camera.quaternion)
  pigeon.material.opacity = 1 - etat.k
  pigeon.visible = etat.k < 0.98
  suivre()
  renderer.render(scene, camera)
  requestAnimationFrame(boucle)
}
dire('3D', null)
boucle()
</script>
